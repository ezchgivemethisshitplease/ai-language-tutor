<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor — Dictation</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-family: var(--font-display); font-size: 17px; }
  .brand span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  main { width: 100%; max-width: 620px; margin: 0 auto; padding: 32px 22px 80px; box-sizing: border-box; }
  h1 { font-family: var(--font-text); font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  .how { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 28px; }
  .item { border-top: 1px solid var(--line); padding: 20px 0; }
  .n { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  audio { width: 100%; margin: 8px 0 2px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent-strong); padding: 6px 0; }
  .en { font-family: var(--font-text); font-size: 20px; line-height: 1.5; margin: 6px 0 2px; }
  .es { font-size: 15px; font-style: italic; color: var(--ink-soft); }
  .note { font-size: 14px; color: var(--ink-soft); background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 10px; }
  .empty { color: var(--ink-faint); padding: 40px 0; }
</style>
</head>
<body>
<header class="activity-header">
  <div class="activity-heading"><a class="back-to-chat" href="index.html">← Моё обучение</a><a class="back-to-chat" href="chat.html">К занятию</a><div class="brand"><b>Tutor</b><span>Диктант</span></div></div>
</header>
<main>
  <h1 id="title"></h1>
  <p class="how">Прослушайте предложение и запишите его <b>в чате</b>. Затем откройте текст и сравните. Если плеер недоступен, используйте голос браузера.</p>
  <div id="items"><p class="empty">Loading…</p></div>
</main>
<script src="client.js"></script>
<script>
(async () => {
  try {
    const response = await fetch('/api/dictation'); const d = await response.json();
    document.title = 'Tutor — ' + d.title;
    document.getElementById('title').textContent = d.title;
    const items = await Promise.all(d.sentences.map(async (s, i) => {
      const src = await Tutor.audioUrl(s.en);
      return `<div class="item"><div class="n">${Tutor.escape(d.label || 'Предложение')} ${i+1}</div>
        <audio controls preload="none" src="${Tutor.escape(src)}"></audio>
        <button data-speak="${i}">Озвучить голосом браузера</button>
        <details><summary>Показать текст</summary><div class="en">${Tutor.escape(s.en)}</div>
        <div class="es">${Tutor.escape(s.l1 || s.es || '')}</div>
        ${s.note ? `<div class="note">${Tutor.escape(s.note)}</div>` : ''}</details></div>`;
    }));
    document.getElementById('items').innerHTML = items.join('');
    document.getElementById('items').addEventListener('click', event => {
      const button = event.target.closest('[data-speak]'); if (!button) return;
      const utterance = new SpeechSynthesisUtterance(d.sentences[+button.dataset.speak].en);
      utterance.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(utterance);
    });
  } catch (error) { Tutor.status('Диктант не загружен. Сначала подготовьте задание.', () => location.reload()); }
})();
</script>
</body>
</html>
